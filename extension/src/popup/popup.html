<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Saka - Safaricom Knowledge Assistant</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Ask Saka</h1>
          <p class="brand-subtitle">Safaricom Knowledge Assistant</p>
        </div>
      </div>

      <div class="header-actions">
        <div id="sync-status-badge" class="status-pill status-checking" title="Sync Status">
          <span class="status-dot"></span>
          <span id="sync-status-text">Checking...</span>
        </div>
        <button id="btn-settings-toggle" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sync Notice Banner -->
    <div id="sync-banner" class="sync-banner hidden">
      <div class="sync-banner-content">
        <div class="sync-banner-text">
          <strong id="sync-banner-title">Sync Notice</strong>
          <span id="sync-banner-desc">Articles on SakaHub have been updated.</span>
        </div>
        <button id="btn-sync-now" class="btn-sync">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Sync Now
        </button>
      </div>
      <div id="sync-progress-bar-container" class="progress-container hidden">
        <div id="sync-progress-bar" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Welcome / Suggestion Chips -->
      <div id="suggestions-container" class="suggestions-container">
        <span class="suggestions-label">Try asking:</span>
        <div class="chips-row">
          <button class="chip" data-query="How do I reverse an M-Pesa transaction?">M-Pesa reversal</button>
          <button class="chip" data-query="What are the withdrawal charges for M-Pesa?">Withdrawal fees</button>
          <button class="chip" data-query="What is the daily agent float limit?">Agent float limit</button>
          <button class="chip" data-query="How to onboard a new Postpaid customer?">Postpaid onboarding</button>
        </div>
      </div>

      <!-- Results & Answers Area -->
      <div id="results-area" class="results-area hidden">
        <div class="answer-card">
          <div class="answer-header">
            <div class="answer-label">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Answer</span>
            </div>
            <button id="btn-copy-answer" class="btn-copy" title="Copy answer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              Copy
            </button>
          </div>
          <div id="answer-body" class="answer-body markdown-body"></div>
        </div>

        <!-- Citations Section -->
        <div id="citations-section" class="citations-section hidden">
          <div class="citations-header">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>Verified Sources (<span id="citations-count">0</span>)</span>
          </div>
          <div id="citations-list" class="citations-list"></div>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="loading-state hidden">
        <div class="spinner"></div>
        <p id="loading-text">Searching SakaHub & synthesizing answer...</p>
      </div>
    </main>

    <!-- Query Input Bar -->
    <footer class="input-footer">
      <form id="ask-form" class="query-form">
        <div class="input-wrapper">
          <textarea
            id="query-input"
            class="query-input"
            rows="1"
            placeholder="Ask anything about SakaHub policies, SOPs, tariffs..."
            required
          ></textarea>
          <button type="submit" id="btn-submit" class="btn-submit" title="Send question (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Extension Settings</h2>
          <button id="btn-close-settings" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="input-backend-url">Backend Server URL</label>
            <input type="url" id="input-backend-url" class="text-input" placeholder="http://localhost:3000" />
            <span class="help-text">Point to your local or deployed Ask Saka backend API.</span>
          </div>
          <div id="connection-test-result" class="test-result-box hidden"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-test-connection" class="btn-secondary">Test Connection</button>
          <button id="btn-save-settings" class="btn-primary">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
